<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paul</title>
<meta name="description" content="Un mec normal dans un monde de fou.">
<meta property="og:title" content="Paul">
<meta property="og:description" content="Un mec normal dans un monde de fou.">
<meta property="og:image" content="https://paulnrtt.fr/paul.jpg">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://paulnrtt.fr/">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://paulnrtt.fr/">
<link rel="icon" href="paul.jpg">
<meta name="theme-color" content="#070b12">
<style>
  :root {
    --bg: #070b12;
    --card: #0d1320;
    --text: #f5efe8;
    --muted: #aeb4bf;
    --cream: #f8f1ea;
    --ink: #0a0f1a;
    --accent: #e8a36b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(60% 50% at 12% 18%, rgba(110, 50, 25, .35), transparent 70%),
      radial-gradient(50% 40% at 90% 95%, rgba(90, 60, 40, .25), transparent 70%),
      var(--bg);
  }
  main {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  /* ---------- Carte (ordinateur) ---------- */
  .card {
    position: relative;
    width: 100%; max-width: 980px;
    min-height: 560px;
    display: grid; grid-template-columns: 46% 54%;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  .photo { position: relative; min-height: 560px; }
  .photo img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 26%;
  }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 55%, var(--card) 100%);
  }
  .info {
    display: flex; flex-direction: column; justify-content: center;
    gap: 14px; padding: 40px 44px 40px 20px;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    width: fit-content;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--text); text-decoration: none;
    font-size: 13px; font-weight: 500;
    transition: background .2s;
  }
  .badge:hover, .badge:focus-visible { background: rgba(255,255,255,.14); }
  .badge svg { width: 15px; height: 15px; flex: none; }
  h1 {
    font-size: clamp(40px, 5vw, 56px);
    line-height: 1; font-weight: 800; letter-spacing: -.03em;
  }
  .tagline { color: var(--muted); font-size: 16px; line-height: 1.4; }
  hr { border: 0; height: 1px; background: rgba(255,255,255,.08); margin: 6px 0 4px; }

  .cta {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 16px 12px 12px;
    background: var(--cream); color: var(--ink);
    border-radius: 22px; text-decoration: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    transition: transform .2s, box-shadow .2s;
  }
  .cta:hover, .cta:focus-visible { transform: translateY(-2px); box-shadow: 0 16px 38px rgba(0,0,0,.45); }
  .cta .age {
    flex: none; display: grid; place-items: center;
    width: 54px; height: 54px; border-radius: 14px;
    background: var(--ink); color: var(--text);
    border: 1.5px solid #8a4b3a;
    font-weight: 800; font-size: 19px; letter-spacing: -.02em;
  }
  .cta .label { flex: 1; font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
  .cta .arrow {
    flex: none; display: grid; place-items: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--ink); color: var(--text);
  }
  .cta .arrow svg { width: 16px; height: 16px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .flag {
    display: inline-block; vertical-align: middle;
    width: .62em; height: .42em; margin-left: .18em; margin-top: -.08em;
    border-radius: 5px; box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 4px 12px rgba(0,0,0,.4);
  }

  /* Reflet qui passe sur le bouton */
  .cta { position: relative; overflow: hidden; isolation: isolate; }
  .cta::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent);
    transform: skewX(-18deg); z-index: -1;
    animation: shine 4.5s ease-in-out 1.6s infinite;
  }
  @keyframes shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }
  .cta .arrow { transition: transform .25s; }
  .cta:hover .arrow, .cta:focus-visible .arrow { transform: translate(2px, -2px) scale(1.06); }
  .cta:active { transform: scale(.98); }

  /* Apparition en douceur */
  .photo img { animation: zoomIn 1.4s cubic-bezier(.2,.7,.2,1) both; }
  .info > * { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .info > :nth-child(1) { animation-delay: .15s; }
  .info > :nth-child(2) { animation-delay: .25s; }
  .info > :nth-child(3) { animation-delay: .35s; }
  .info > :nth-child(4) { animation-delay: .42s; }
  .info > :nth-child(5) { animation-delay: .5s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes zoomIn { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }

  /* ---------- Téléphone (plein écran) ---------- */
  @media (max-width: 760px) {
    main { padding: 0; align-items: stretch; }
    .card {
      display: block; max-width: none; min-height: 100vh; min-height: 100dvh;
      border: 0; border-radius: 0; box-shadow: none; background: var(--bg);
    }
    .photo { position: absolute; inset: 0; min-height: 0; }
    .photo img { object-position: 50% 22%; }
    .photo::after {
      background: linear-gradient(180deg, rgba(7,11,18,0) 38%, rgba(7,11,18,.78) 68%, var(--bg) 92%);
    }
    .info {
      position: relative; z-index: 1;
      min-height: 100vh; min-height: 100dvh;
      justify-content: flex-end;
      padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
      gap: 12px;
    }
    h1 { font-size: 56px; }
    .tagline { font-size: 20px; color: #c3c8d0; margin-bottom: 8px; }
    hr { display: none; }
    .badge { font-size: 16px; padding: 10px 18px; background: rgba(15,20,32,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .badge svg { width: 20px; height: 20px; }
    .cta { padding: 14px 18px 14px 14px; border-radius: 28px; }
    .cta .age { width: 66px; height: 66px; font-size: 24px; border-radius: 16px; }
    .cta .label { font-size: 21px; }
    .cta .arrow { width: 52px; height: 52px; }
    .cta .arrow svg { width: 20px; height: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="photo">
      <img src="paul.jpg" alt="Portrait de Paul" fetchpriority="high">
    </div>
    <div class="info">
      <div class="badges">
        <a class="badge" href="https://www.instagram.com/paulnrtt2" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e8a36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#e8a36b" stroke="none"/></svg>
          @paulnrtt2
        </a>
        <a class="badge" href="https://www.snapchat.com/add/paulnrtt" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e8a36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-3 0-5 2.2-5 5.2v2.3c-.8.2-1.6.4-2.3.6.6.9 1.4 1.2 2.3 1.3-.3 1.5-1.4 2.7-3 3.4 1 .6 2 .8 3 .9.3.7.7 1 1.5 1 1 0 1.8 1.3 3.5 1.3s2.5-1.3 3.5-1.3c.8 0 1.2-.3 1.5-1 1-.1 2-.3 3-.9-1.6-.7-2.7-1.9-3-3.4.9-.1 1.7-.4 2.3-1.3-.7-.2-1.5-.4-2.3-.6V8.2C17 5.200 15 3 12 3z"/></svg>
          @paulnrtt
        </a>
      </div>
      <h1>Paul
        <svg class="flag" viewBox="0 0 30 20" role="img" aria-label="Drapeau de l'Italie">
          <rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#f4f5f0"/><rect x="20" width="10" height="20" fill="#ce2b37"/>
        </svg>
      </h1>
      <p class="tagline">un mec normal dans un monde de fou.</p>
      <hr>
      <a class="cta" href="https://uv.club/paul.nrtt" target="_blank" rel="noopener noreferrer">
        <span class="age">18+</span>
        <span class="label">My private page</span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>
        </span>
      </a>
    </div>
  </section>
</main>
</body>
</html>

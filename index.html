<!DOCTYPE html>

<head>

<style>
  :root {
    --bg: #0a0d14;
    --card: #0f1420;
    --text: #f6efe6;
    --muted: #a9afbb;
    --cream: #f6efe6;
    --ink: #0a0d14;
    --ember: #e8a36b;
    --line: rgba(246,239,230,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(60% 50% at 10% 15%, rgba(120,55,28,.34), transparent 70%),
      radial-gradient(50% 40% at 92% 96%, rgba(90,60,40,.22), transparent 70%),
      var(--bg);
  }
  main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  .card {
    width: 100%; max-width: 1000px; min-height: 580px;
    display: grid; grid-template-columns: 46% 54%;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  .photo { position: relative; min-height: 580px; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 26%; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 58%, var(--card) 100%); }

  .info { display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 44px 48px 44px 16px; }
  h1 { font-size: clamp(46px, 5.4vw, 64px); line-height: .95; font-weight: 800; letter-spacing: -.035em; }
  .flag {
    display: inline-block; vertical-align: middle;
    width: .6em; height: .4em; margin-left: .2em; margin-top: -.08em;
    border-radius: 5px; box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 4px 12px rgba(0,0,0,.4);
  }
  .tagline { color: var(--muted); font-size: 18px; line-height: 1.4; margin-top: -8px; }

  /* Réseaux : vrais logos */
  .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .social {
    display: flex; align-items: center; gap: 12px; min-width: 0;
    padding: 10px 14px 10px 10px; border-radius: 18px;
    background: rgba(246,239,230,.05); border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    transition: background .2s, transform .2s, border-color .2s;
  }
  .social:hover, .social:focus-visible { background: rgba(246,239,230,.10); border-color: rgba(246,239,230,.22); transform: translateY(-2px); }
  .social:active { transform: scale(.98); }
  .logo { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; }
  .logo svg { width: 26px; height: 26px; display: block; }
  .logo.ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); color: #fff; }
  .logo.sc { background: #fffc00; color: #fff; }
  .logo.sc svg path { stroke: #0a0d14; stroke-width: .9; paint-order: stroke fill; stroke-linejoin: round; }
  .social .txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .social .net { font-size: 12px; color: var(--muted); }
  .social .handle { font-size: 16px; font-weight: 650; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .cta {
    position: relative; overflow: hidden; isolation: isolate;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 16px 12px 12px;
    background: var(--cream); color: var(--ink);
    border-radius: 24px; text-decoration: none;
    box-shadow: 0 12px 32px rgba(0,0,0,.38);
    transition: transform .2s, box-shadow .2s;
  }
  .cta:hover, .cta:focus-visible { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(0,0,0,.48); }
  .cta:active { transform: scale(.98); }
  .cta .age {
    flex: none; display: grid; place-items: center;
    width: 56px; height: 56px; border-radius: 15px;
    background: var(--ink); color: var(--text); border: 1.5px solid #8a4b3a;
    font-weight: 800; font-size: 20px; letter-spacing: -.02em;
  }
  .cta .label { flex: 1; font-weight: 650; font-size: 18px; letter-spacing: -.01em; }
  .cta .arrow { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--text); transition: transform .25s; }
  .cta .arrow svg { width: 17px; height: 17px; }
  .cta:hover .arrow, .cta:focus-visible .arrow { transform: translate(2px,-2px) scale(1.06); }
  .cta::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent);
    transform: skewX(-18deg); z-index: -1; animation: shine 4.5s ease-in-out 1.6s infinite;
  }
  @keyframes shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }
  a:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

  .photo img { animation: zoomIn 1.3s cubic-bezier(.2,.7,.2,1) both; }
  .info > * { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .info > :nth-child(1) { animation-delay: .12s; } .info > :nth-child(2) { animation-delay: .2s; }
  .info > :nth-child(3) { animation-delay: .3s; } .info > :nth-child(4) { animation-delay: .4s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes zoomIn { from { opacity: 0; transform: scale(1.07); } to { opacity: 1; transform: none; } }


  /* Étape 18+ (feuille du bas sur mobile, carte sur ordi) */
  dialog.gate { border: 0; padding: 0; background: transparent; color: var(--text); max-width: none; max-height: none; width: 100%; height: 100%; margin: 0; }
  dialog.gate::backdrop { background: rgba(4,6,10,.78); backdrop-filter: blur(10px) saturate(.8); -webkit-backdrop-filter: blur(10px) saturate(.8); }
  dialog.gate[open] { display: grid; place-items: end center; padding: 0; }
  .gate-box {
    position: relative; width: 100%; max-width: 460px; text-align: left; overflow: hidden;
    padding: 30px 26px calc(26px + env(safe-area-inset-bottom));
    border-radius: 28px 28px 0 0; background: linear-gradient(180deg,#141b29,#0d121c);
    border: 1px solid var(--line); border-bottom: 0;
    box-shadow: 0 -20px 70px rgba(0,0,0,.55);
    animation: sheet .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .gate-box::before { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px; background: radial-gradient(circle, rgba(232,163,107,.28), transparent 65%); pointer-events: none; }
  @keyframes sheet { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  .gate-seal { position: relative; display: grid; place-items: center; width: 74px; height: 74px; border-radius: 50%; border: 2px solid var(--ember); color: var(--ember); font-weight: 800; font-size: 26px; letter-spacing: -.04em; box-shadow: 0 0 0 7px rgba(232,163,107,.1), inset 0 0 22px rgba(232,163,107,.12); }
  .gate-box h2 { position: relative; margin: 22px 0 8px; font-size: 27px; line-height: 1.12; font-weight: 800; letter-spacing: -.03em; }
  .gate-box p { position: relative; color: var(--muted); font-size: 16px; line-height: 1.45; margin-bottom: 24px; max-width: 34ch; }
  .gate-yes { position: relative; display: block; padding: 18px 16px; border-radius: 18px; background: linear-gradient(135deg,#f1b782,#e8a36b); color: #1a1006; text-align: center; text-decoration: none; font-weight: 700; font-size: 17px; letter-spacing: -.01em; box-shadow: 0 10px 28px rgba(232,163,107,.28); transition: transform .2s; }
  .gate-yes:hover, .gate-yes:focus-visible { transform: translateY(-2px); }
  .gate-yes:active { transform: scale(.98); }
  .gate-no { position: relative; display: block; margin: 14px auto 0; padding: 8px 14px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; border-radius: 12px; }
  .gate-no.pill { border: 1px solid var(--line); padding: 8px 18px; border-radius: 999px; }
  .gate-no:hover, .gate-no:focus-visible { color: var(--text); }
  @media (min-width: 761px) {
    dialog.gate[open] { place-items: center; padding: 20px; }
    .gate-box { border-radius: 28px; border-bottom: 1px solid var(--line); padding-bottom: 26px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  }
  @media (max-width: 760px) {
    main { padding: 0; align-items: stretch; }
    .card { display: block; max-width: none; min-height: 100vh; min-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; background: var(--bg); }
    .photo { position: absolute; inset: 0; min-height: 0; overflow: hidden; }
    .photo img { height: 108%; top: -7%; object-position: 50% 0%; }
    .photo::after { background: linear-gradient(180deg, rgba(10,13,20,0) 36%, rgba(10,13,20,.8) 66%, var(--bg) 90%); }
    .info { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; justify-content: flex-end; gap: 14px; padding: 24px 18px calc(26px + env(safe-area-inset-bottom)); }
    h1 { font-size: 56px; }
    .tagline { text-wrap: balance; font-size: 19px; color: #c9ced7; margin-top: -4px; margin-bottom: 6px; }
    .socials { gap: 10px; }
    .social { padding: 9px 10px 9px 9px; gap: 10px; border-radius: 20px; background: rgba(14,19,31,.62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .logo { width: 48px; height: 48px; border-radius: 14px; }
    .social .handle { font-size: 15px; }
    .cta { padding: 14px 18px 14px 14px; border-radius: 28px; }
    .cta .age { width: 66px; height: 66px; font-size: 24px; border-radius: 17px; }
    .cta .label { font-size: 21px; }
    .cta .arrow { width: 52px; height: 52px; }
    .cta .arrow svg { width: 20px; height: 20px; }
  }
  @media (max-width: 375px) { h1 { font-size: 50px; } .tagline { font-size: 17px; } .social .net { display: none; } .social .handle { font-size: 14px; } .logo { width: 42px; height: 42px; } .cta .label { font-size: 18px; } .cta .age { width: 56px; height: 56px; font-size: 21px; } .cta .arrow { width: 44px; height: 44px; } }
  @media (max-width: 760px) and (max-height: 700px) { h1 { font-size: 42px; } .info { gap: 10px; padding-bottom: calc(18px + env(safe-area-inset-bottom)); } .tagline { font-size: 16px; margin-bottom: 2px; } .cta .age { width: 50px; height: 50px; font-size: 19px; } .cta .arrow { width: 40px; height: 40px; } .cta .label { font-size: 17px; } .logo { width: 40px; height: 40px; } }
  @media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; animation: none !important; } }
</style>

<script>

  document.getElementById('gate-yes').addEventListener('click', function () { setTimeout(function () { g.close(); }, 150); });
  g.addEventListener('click', function (e) { if (e.target === g) g.close(); });
})();
</script>
